[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rockart-agent"
version = "0.1.0"
description = "LangGraph agent for rock art instance segmentation."
requires-python = ">=3.10"
dependencies = [
    "requests",
    "langgraph",
    "openai",
]

[project.scripts]
rockart-agent = "rockart_agent.cli:main"

[tool.setuptools]
packages = ["rockart_agent"]
